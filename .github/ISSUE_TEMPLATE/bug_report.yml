name: Bug Report
description: Report a bug or unexpected behaviour
title: "[Bug]: "
labels: bug
type: Bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form as completely as possible.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Which version of the plugin are you using?
      placeholder: "e.g., 1.3.0"
    validations:
      required: true
  - type: input
    id: server-software
    attributes:
      label: Server software & version
      description: What server software and Minecraft version? (Paper, Spigot, etc.)
      placeholder: "e.g., Paper 26.1.2 build #61"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen instead.
      placeholder: "When a player types ... the chat filter does not block the message."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we trigger this bug?
      placeholder: |
        1. Start the server with plugin version X
        2. Join as a player with permission Y
        3. Type '...' in chat
        4. See error/behaviour
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any errors or warnings from the console. This will be rendered as code automatically.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Videos (optional)
      description: If applicable, drag and drop images or videos to help explain the problem.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else you think we should know? (plugin list, custom configuration, etc.)