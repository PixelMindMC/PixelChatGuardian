// Gradle plugins
plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.1'
}

// Project metadata
group = 'de.pixelmindmc'
version = '1.2.0'
description = 'AI-powered chat moderation featuring smart filtering, anti-spam and rich chat formatting including emojis and colors'

// Dependency versions
ext {
    spigotVersion = '26.1.2-R0.1-SNAPSHOT'
    commonsLang3Version = '3.20.0'
    carbonChatVersion = '3.0.0-beta.37'
    bstatsVersion = '3.2.1'
}

// Declare project repositories
repositories {
    // Maven Central repository
    mavenCentral()

    // SpigotMC repository
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
        content {
            includeGroup 'org.spigotmc'
        }
    }
}

// Dependency management
dependencies {
    // Provided dependencies (available at runtime)
    compileOnly "org.spigotmc:spigot-api:${spigotVersion}"
    compileOnly "org.apache.commons:commons-lang3:${commonsLang3Version}"
    compileOnly "de.hexaoxi:carbonchat-api:${carbonChatVersion}"

    // Bundled dependencies (included in final JAR)
    implementation "org.bstats:bstats-bukkit:${bstatsVersion}"
}

// Java configuration
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Java compilation settings
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:unchecked',
                                 '-Xlint:deprecation',
                                 '-parameters'])
}

// Task management disable standard jar
jar {
    enabled = false
}

// Shadow JAR configuration for plugin distribution
shadowJar {
    // Remove classifier for cleaner file naming
    archiveClassifier.set('')

    // Relocate bStats into the plugin's package to avoid conflicts
    relocate('org.bstats', 'de.pixelmindmc.pixelchat.metrics')

    // Optimize dependencies
    dependencies {
        // Only merge bStats into the final jar, no other dependencies
        exclude { it.moduleGroup != 'org.bstats' }
    }

    // Exclude unnecessary files to reduce JAR size
    exclude('META-INF/*.SF',
            'META-INF/*.DSA',
            'META-INF/*.RSA',
            'META-INF/LICENSE',
            'META-INF/LICENSE.txt',
            'META-INF/NOTICE',
            'META-INF/NOTICE.txt',
            '**/module-info.class',
            '**/package-info.class')

    // Manifest configuration
    manifest {
        attributes('Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'PixelMindMC',
                'Gradle-Version': gradle.gradleVersion,
                'Build-JDK': "${System.properties['java.version']} (${System.properties['java.vendor']} ${System.properties['java.vm.version']})",
                'Build-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"))
    }
}

// Ensure shadowJar is built
tasks.assemble {
    dependsOn shadowJar
}

// Process resources with filtering
tasks.processResources {
    filteringCharset = 'UTF-8'
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    // Inject version, name and description into plugin.yml and other files
    def properties = [version    : project.version,
                      name       : project.name,
                      description: project.description]

    filesMatching(['**/*.yml', '**/*.yaml', '**/*.json']) {
        expand(properties)
    }
}

// Reproducible builds configuration
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Task to display build information
tasks.register('buildInfo') {
    doLast {
        println "Project: ${project.name}"
        println "Version: ${project.version}"
        println "Group: ${project.group}"
        println "Java Version: ${JavaVersion.current()}"
        println "Gradle Version: ${gradle.gradleVersion}"
    }
}